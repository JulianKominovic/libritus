appId: dev.jkominovic.libritus
productName: Libritus
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - resources/**
  - '!**/.cursor/**'
  - '!**/e2e/**'
  - '!**/docs/**'
  - '!**/test-results/**'
  - '!**/AGENTS.md'
  - '!**/skills-lock.json'
  - '!**/out/renderer/stats.html'
  - '!**/node_modules/onnxruntime-web/**'
  - '!**/node_modules/**/{README,CHANGELOG,LICENSE}*'
  - '!**/node_modules/**/*.{md,map,ts,tsx}'
compression: maximum
asarUnpack:
  - resources/**
# Shared so dmg/zip/nsis/AppImage all get os+arch in the filename.
artifactName: ${name}-${version}-${os}-${arch}-setup.${ext}
win:
  executableName: libritus
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - arm64
    # zip required for electron-updater on macOS (dmg is install-only).
    - target: zip
      arch:
        - arm64
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # ponytail: unsigned Mac updates are not production-safe — enable when CSC / notarize env is set.
  notarize: false
linux:
  target:
    - AppImage
  maintainer: jkominovic.dev
  category: Productivity
npmRebuild: false
publish:
  provider: github
  owner: JulianKominovic
  repo: libritus
